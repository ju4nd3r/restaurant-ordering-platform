services:
  caddy:
    image: caddy:2-alpine
    container_name: resto_caddy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - resto_net

  postgres:
    image: postgres:16-alpine
    container_name: resto_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - resto_net

  redis:
    image: redis:7-alpine
    container_name: resto_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    networks:
      - resto_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: resto_api_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - resto_net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: resto_web_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - api
    networks:
      - resto_net

volumes:
  caddy_data:
  caddy_config:
  postgres_data_prod:
  redis_data_prod:

networks:
  resto_net:
    driver: bridge
