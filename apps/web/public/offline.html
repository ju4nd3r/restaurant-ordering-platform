<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión a Internet</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafaf9;
      color: #1c1917;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 14px;
      color: #78716c;
      margin: 0 0 24px 0;
      max-width: 320px;
    }
    button {
      background-color: #f59e0b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📶</div>
  <h1>Sin conexión a internet</h1>
  <p>Parece que perdiste la señal. Verifica tu conexión Wi-Fi o datos móviles para continuar con tu pedido.</p>
  <button onclick="window.location.reload()">Reintentar</button>
</body>
</html>
