packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'argon2'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'prisma'
  - 'sharp'
  - '@scarf/scarf'
